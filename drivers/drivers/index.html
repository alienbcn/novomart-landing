<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Trabajo CDL en EEUU | NOVOMART Trades</title><meta name="description" content="Consulta de trabajo CDL en EEUU. Orientación para conductores y servicios para owner-operators. English and Spanish."><style>
:root{color-scheme:dark;--gold:#d0ad6c;--ink:#101112;--white:#f7f4ec;--dim:#bbb7ad}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--white);font:16px/1.6 Arial,sans-serif}a{color:var(--gold)}header,main,footer{max-width:1080px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #353330}.brand{font-size:19px;font-weight:bold;letter-spacing:.1em;text-decoration:none;color:var(--white)}.brand span{color:var(--gold);font-weight:normal}button,.btn{min-height:44px;border:1px solid var(--gold);border-radius:3px;background:var(--gold);color:#16130d;font-weight:bold;padding:12px 20px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}#language{background:transparent;color:var(--gold)}.hero{padding:58px 0 46px;max-width:790px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.17em;text-transform:uppercase}h1{font-size:clamp(40px,6vw,70px);line-height:1.05;letter-spacing:-.04em;margin:20px 0}h2{font-size:28px;letter-spacing:-.02em}p{color:var(--dim)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{border:1px solid #49443b;background:#191a1a;padding:26px}.choice h2{margin:0 0 12px}.note{font-size:13px;color:var(--dim)}form{border-top:1px solid #353330;margin-top:42px;padding-top:26px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:14px}input,select{display:block;width:100%;min-height:48px;background:#1d1e1e;color:var(--white);border:1px solid #575146;padding:12px;font:inherit;border-radius:3px;margin-top:7px}.wide{grid-column:1/-1}.consent{display:flex;align-items:flex-start;gap:12px;margin:22px 0}.consent input{width:22px;min-width:22px;height:22px;min-height:22px;margin:3px 0}.consent span{line-height:1.5}.notice{padding:20px;border:1px solid #49443b;margin:24px 0;background:#191a1a}.hidden{display:none!important}footer{margin-top:40px;border-top:1px solid #353330;font-size:12px;color:var(--dim)}@media(max-width:650px){header,main,footer{padding:20px}.hero{padding:40px 0 28px}.choices,.fields{grid-template-columns:1fr}.wide{grid-column:auto}.brand{font-size:15px}h1{font-size:44px}.choice{padding:22px}}
</style></head><body><header><a class="brand" href="/">NOVOMART <span>Trades</span></a><button id="language" type="button">English</button></header><main><section class="hero"><div class="eyebrow" data-es="CONDUCTORES CDL · ESTADOS UNIDOS" data-en="CDL DRIVERS · UNITED STATES"></div><h1 data-es="Trabajo CDL en EEUU" data-en="Find your next CDL opportunity."></h1><p data-es="¿Tienes CDL-A y buscas otra empresa? Cuéntanos tu experiencia, dónde vives y qué rutas quieres. NOVOMART te ayuda a orientar tu búsqueda y, con tu permiso, te presenta a una agencia de reclutamiento. La contratación y las condiciones dependen de cada empresa." data-en="Have a CDL-A and looking for another company? Tell us about your experience, where you live and the routes you want. NOVOMART helps guide your search and, with your permission, introduces you to a recruiting agency. Hiring and terms depend on each company."></p></section><div class="choices"><article class="choice"><h2 data-es="Busco trabajo como conductor" data-en="I am looking for a driving job"></h2><p data-es="Empleado CDL-A, recién graduado o en formación. Tu experiencia nos ayuda a orientar la consulta." data-en="CDL-A employee, new graduate or trainee. Your experience helps us guide your inquiry."></p><a class="btn" href="#inquiry" data-es="Enviar consulta" data-en="Start an inquiry"></a></article><article class="choice"><h2 data-es="Tengo camión o empresa" data-en="I own a truck or carrier"></h2><p data-es="Buscas cargas, dispatch o apoyo para arrancar. Habla directamente con NOVOMART." data-en="Need loads, dispatch or help getting started? Speak directly with NOVOMART."></p><a class="btn" href="/#contact" data-es="Servicios para carriers" data-en="Carrier services"></a></article></div><form id="inquiry"><h2 data-es="Cuéntanos tu perfil" data-en="Tell us about yourself"></h2><p class="note" data-es="* Obligatorio. No envíes SSN, documentos CDL, datos bancarios ni información médica." data-en="* Required. Do not send an SSN, CDL documents, bank details or medical information."></p><div class="fields" id="fields"></div><label class="consent"><input type="checkbox" id="contactConsent" required><span data-es="Autorizo a NOVOMART a contactarme sobre esta consulta por el canal que elijo. No autoriza mensajes promocionales masivos ni compartir mis datos con otras empresas." data-en="I allow NOVOMART to contact me about this inquiry through my chosen channel. This does not allow bulk marketing or sharing my details with other companies."></span></label><div class="notice"><b data-es="Tú revisas y envías el correo" data-en="You review and send the email"></b><p class="note" data-es="Este formulario abre tu aplicación de correo con tu consulta dirigida a info@novomart.net. No se guarda ni envía automáticamente. Para presentarte a una agencia te pediremos permiso aparte, indicando la agencia y los datos que se compartirán. No hay garantía de contratación, sueldo ni fecha de respuesta." data-en="This form opens your email app with an inquiry addressed to info@novomart.net. It does not save or send automatically. Before introducing you to an agency, we will ask separately and name the agency and the details to be shared. No job, salary or response time is guaranteed."></p></div><button type="submit" data-es="Abrir correo para revisar" data-en="Open email for review"></button><p id="fallback" class="hidden"><a id="mailLink" data-es="Si no se abre, pulsa aquí" data-en="If it does not open, click here"></a></p></form></main><footer>NOVOMART Trades · NOVO LOGISTICS LLC · <a href="mailto:info@novomart.net">info@novomart.net</a> · +1 559 335 8439</footer><script>
let lang='es';const items=[['name','Nombre *','Name *','text',true],['phone','Teléfono *','Phone *','tel',true],['email','Email (opcional)','Email (optional)','email',false],['state','Estado / ZIP *','State / ZIP *','text',true],['cdl','CDL-A *','CDL-A *',['Selecciona|Select','Sí|Yes','No|No','En formación|In training'],true],['experience','Meses de experiencia *','Months of experience *','number',true],['equipment','Equipo','Equipment',['Selecciona|Select','Dry van|Dry van','Reefer|Reefer','Flatbed|Flatbed','Tanker|Tanker','Otro|Other'],false],['routes','Rutas preferidas','Preferred routes',['Selecciona|Select','Local|Local','Regional|Regional','OTR|OTR','Flexible|Flexible'],false],['home','Home time deseado','Preferred home time','text',false],['available','Fecha disponible','Available from','date',false],['spoken','Idioma','Language',['Selecciona|Select','Español|Spanish','Inglés|English','Ambos|Both'],false],['channel','Canal preferido *','Preferred contact channel *',['Selecciona|Select','Teléfono|Phone','SMS|SMS','Email|Email'],true]];
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-es]').forEach(e=>e.textContent=e.dataset[lang]);document.getElementById('language').textContent=lang==='es'?'English':'Español';const box=document.getElementById('fields');if(!box.children.length)items.forEach(([id,es,en,type,required])=>{const label=document.createElement('label');label.htmlFor=id;const text=document.createElement('span');text.dataset.es=es;text.dataset.en=en;label.append(text);const field=document.createElement(Array.isArray(type)?'select':'input');field.id=id;field.name=id;field.required=required;if(Array.isArray(type))type.forEach((opt,i)=>{const o=document.createElement('option');o.value=i===0?'':opt.split('|')[1];o.dataset.es=opt.split('|')[0];o.dataset.en=opt.split('|')[1];field.append(o)});else{field.type=type;field.maxLength=100;if(type==='number'){field.min=0;field.max=720}}label.append(field);box.append(label)});document.querySelectorAll('[data-es]').forEach(e=>e.textContent=e.dataset[lang])}render();document.getElementById('language').onclick=()=>{lang=lang==='es'?'en':'es';render()};document.getElementById('inquiry').onsubmit=e=>{e.preventDefault();let lines=[lang==='es'?'Consulta conductor CDL - NOVOMART':'CDL driver inquiry - NOVOMART'];items.forEach(([id,es,en])=>{const f=document.getElementById(id);lines.push((lang==='es'?es:en)+': '+f.value)});lines.push('Consent: contact about this inquiry only. No onward disclosure approved.');const url='mailto:info@novomart.net?subject='+encodeURIComponent('CDL driver inquiry - NOVOMART')+'&body='+encodeURIComponent(lines.join('\n'));document.getElementById('mailLink').href=url;document.getElementById('fallback').classList.remove('hidden');location.href=url};
</script></body></html>
